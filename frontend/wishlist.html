<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Wishlist | ROAM & REV</title>
  <meta name="description" content="Manage your saved motorcycle gear and travel equipment." />
  
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <!-- Sticky Header -->
  <header class="navbar" id="site-header">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <div class="brand-name">ROAM<span>&</span>REV</div>
          <div class="brand-tagline">MOTO & OVERLAND CO.</div>
        </div>
      </a>

      <nav class="nav-menu">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/shop.html" class="nav-link">Shop All</a>
        <a href="/shop.html?category=motorcycle-accessories" class="nav-link">Motorcycle Gear</a>
        <a href="/shop.html?category=travel-accessories" class="nav-link">Travel Gear</a>
      </nav>

      <div class="nav-actions">
        <a href="/wishlist.html" class="nav-action-btn" title="Saved Wishlist">
          ♥
          <span class="nav-badge-counter wishlist-badge-count" style="display:none;">0</span>
        </a>

        <a href="/cart.html" class="nav-action-btn" title="Shopping Cart">
          🛒
          <span class="nav-badge-counter cart-badge-count" style="display:none;">0</span>
        </a>

        <div class="account-dropdown-wrapper">
          <button class="nav-action-btn" id="account-menu-trigger" title="Account">👤</button>
          <div class="account-menu" id="account-dropdown"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content" style="padding-bottom: var(--space-20);">
    <div class="container" style="padding-top: var(--space-8);">
      
      <div class="section-header" style="text-align:left; margin-bottom: var(--space-8);">
        <span class="subtitle">Saved Expeditions</span>
        <h1>YOUR WISHLIST</h1>
      </div>

      <div id="wishlist-container" class="grid grid-cols-4 gap-6"></div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div class="footer-copyright">© 2026 ROAM & REV Moto & Overland Outfitters.</div>
        <div class="payment-badges">
          <span class="pay-badge">UPI</span>
          <span class="pay-badge">RuPay</span>
          <span class="pay-badge">VISA</span>
          <span class="pay-badge">MasterCard</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/ui.js"></script>
  
  <script>
    function renderWishlist() {
      const container = document.getElementById('wishlist-container');
      const items = window.Wishlist.items || [];

      if (!items.length) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding:80px 20px; background:var(--bg-secondary); border-radius:16px;">
            <div style="font-size:3rem; margin-bottom:12px; color:var(--accent-orange);">♥</div>
            <h2>Your Wishlist is Empty</h2>
            <p style="margin:12px 0 24px; color:var(--text-secondary);">Save accessories you plan to equip for upcoming journeys.</p>
            <a href="/shop.html" class="btn btn-primary btn-lg">Browse Catalog</a>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(p => `
        <div class="product-card" data-product-id="${p._id || p.productId}">
          <div class="product-thumb-box">
            <a href="/product.html?id=${p._id || p.productId}">
              <img src="${p.image || ''}" alt="${p.name}" />
            </a>
          </div>
          <div class="product-details">
            <div class="product-compat">${UI.renderCompatibilityBadge(p.bikeCompatibility)}</div>
            <h4 class="product-title">
              <a href="/product.html?id=${p._id || p.productId}">${p.name}</a>
            </h4>
            <div class="product-pricing">
              <span class="current-price">${UI.formatINR(p.price)}</span>
            </div>
            <div class="card-cta-row">
              <button class="btn-add-cart" onclick="window.Cart.addItem({ _id: '${p._id || p.productId}', name: '${p.name.replace(/'/g, "\\'")}', price: ${p.price}, images: ['${p.image}'] }, 1); window.Wishlist.remove('${p._id || p.productId}'); renderWishlist();">
                Move to Cart
              </button>
              <button class="btn-remove-item" onclick="window.Wishlist.remove('${p._id || p.productId}'); renderWishlist();" title="Remove">
                ✕
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderWishlist();
      window.addEventListener('wishlist:change', renderWishlist);
    });
  </script>
</body>
</html>
