<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rider & Admin Sign In | ROAM & REV</title>
  
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar" id="site-header">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <div class="brand-name">ROAM<span>&</span>REV</div>
          <div class="brand-tagline">MOTO & OVERLAND CO.</div>
        </div>
      </a>
      <a href="/index.html" class="btn btn-secondary btn-sm">← Back to Store</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <span class="badge-tag badge-tag-orange" style="margin-bottom:8px;">Adventurer Portal</span>
        <h2>SIGN IN</h2>
        <p>Access your dispatch history, saved addresses and tracking.</p>
      </div>

      <!-- Demo Quick Fill Box -->
      <div class="demo-credentials-box">
        <div class="demo-title">⚡ Instant Demo Authentication</div>
        <div class="demo-btn-group">
          <button type="button" class="demo-fill-btn" onclick="fillDemo('rider@roamrev.com', 'rider123')">
            👤 Rider (Customer)
          </button>
          <button type="button" class="demo-fill-btn" onclick="fillDemo('admin@roamrev.com', 'admin123')">
            🛡️ Store Admin
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="rider@roamrev.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit-btn">
          Sign In to Account →
        </button>
      </form>

      <div style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--text-secondary);">
        Don't have an account? <a href="/register.html" style="color:var(--accent-orange); font-weight:700;">Create One Now</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/wishlist.js"></script>
  <script src="/js/ui.js"></script>
  
  <script>
    function fillDemo(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-submit-btn');

        btn.disabled = true;
        btn.textContent = 'Verifying Credentials...';

        try {
          const res = await window.Auth.login(email, password);
          if (res.success) {
            Toast.show('Welcome Back!', `Signed in as ${res.user.name}`, 'success');
            
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');

            setTimeout(() => {
              if (redirect) {
                window.location.href = redirect;
              } else if (res.user.role === 'admin') {
                window.location.href = '/admin.html';
              } else {
                window.location.href = '/orders.html';
              }
            }, 800);
          }
        } catch (err) {
          Toast.show('Login Failed', err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In to Account →';
        }
      });
    });
  </script>
</body>
</html>
